name: Windows release build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '20', cache: 'npm'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: 'pip', cache-dependency-path: packaging/requirements-executor.txt}
      - name: Build and verify Windows release
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/build-windows-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-release
          path: |
            release/*.exe
            release/release-manifest.json
            release/SHA256SUMS.txt
            release/WINDOWS_RELEASE_ACCEPTANCE.txt
